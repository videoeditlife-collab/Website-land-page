name: Lead generator

# Widget 18 spec: scores creators for return on time investment and writes the
# Lead Generator sheet columns in order.

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Input CSV or txt of channel URLs'
        required: false
        default: 'results/discovered_martial.txt'
      name:
        description: 'Output basename, e.g. martial_leads'
        required: false
        default: 'martial_leads'
      limit:
        description: 'Only score the first N (0 = all)'
        required: false
        default: '3'
      descriptions:
        description: 'Video descriptions to read per channel'
        required: false
        default: '3'
  push:
    branches:
      - claude/youtube-scraper-zn66ns
    paths:
      - 'scraper/.leads-trigger'

permissions:
  contents: write

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: scraper
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Spec fixtures
        working-directory: scraper
        run: python test_lead_generator.py

      - name: Score leads
        working-directory: scraper
        run: |
          set -o pipefail
          SOURCE="${{ github.event.inputs.source }}"
          NAME="${{ github.event.inputs.name }}"
          NAME="${NAME:-martial_leads}"
          # Written to a file the step after this one can find without
          # repeating the default, which is how outdoor_leads.csv came to be
          # hardcoded in four places.
          echo "$NAME" > .leads-name
          ARGS=("${SOURCE:-results/discovered_martial.txt}" "$NAME.csv" --resume)
          DESCRIPTIONS="${{ github.event.inputs.descriptions }}"
          LIMIT="${{ github.event.inputs.limit }}"
          # A push trigger supplies no inputs, so default here rather than only
          # inside the test - the previous form passed an empty --limit and
          # argparse killed the run before anything was produced.
          # One description per channel, not three: 1,024 channels at three
          # watch pages each will not finish inside the job timeout, and the
          # offer links that decide sells_product are on the About page anyway.
          ARGS+=(--descriptions "${DESCRIPTIONS:-1}")
          LIMIT="${LIMIT:-0}"
          if [ "$LIMIT" != "0" ]; then
            ARGS+=(--limit "$LIMIT")
          fi
          python run_lead_generator.py "${ARGS[@]}" 2>&1 | tee "$NAME.log"

      - name: Fail if nothing was produced
        working-directory: scraper
        run: |
          NAME=$(cat .leads-name)
          if [ ! -s "$NAME.csv" ]; then
            echo "::error::$NAME.csv missing or empty - scorer did not run"
            tail -40 "$NAME.log" || true
            exit 1
          fi
          rows=$(($(wc -l < "$NAME.csv") - 1))
          echo "$NAME.csv rows: $rows"
          if [ "$rows" -lt 1 ]; then
            echo "::error::no leads produced"
            tail -40 "$NAME.log" || true
            exit 1
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p scraper/results
          NAME=$(cat scraper/.leads-name)
          cp "scraper/$NAME.csv" "scraper/results/$NAME.csv" 2>/dev/null || true
          cp "scraper/$NAME.log" "scraper/results/$NAME.log" 2>/dev/null || true
          cp scraper/lockup_diag.log scraper/results/lockup_diag.log 2>/dev/null || true
          cp scraper/about_diag.log scraper/results/about_diag.log 2>/dev/null || true
          git add -f scraper/results/ || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Lead generator results from run ${{ github.run_id }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
