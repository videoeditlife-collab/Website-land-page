name: Scrape YouTube channels

# Runs the scraper on a GitHub runner, which has the outbound network access
# that the development container does not, then commits the resulting CSV back
# to this branch.
#
# Triggered by touching scraper/.run-trigger, so a re-run is one small commit.

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'seed (holiday_seed_channels.csv) or search (holiday_terms.txt)'
        required: false
        default: 'search'
      min_subscribers:
        description: 'Minimum subscribers'
        required: false
        default: '80000'
      max_subscribers:
        description: 'Maximum subscribers (empty for no ceiling)'
        required: false
        default: ''
      require_cadence:
        description: 'weekly, biweekly, monthly, or empty for no check'
        required: false
        default: 'monthly'
  push:
    branches:
      - claude/youtube-scraper-zn66ns
    paths:
      - 'scraper/.run-trigger'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Self-test
        working-directory: scraper
        run: python test_scraper.py

      - name: Confirm YouTube is reachable
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://www.youtube.com/)
          echo "youtube.com -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::YouTube returned $code from this runner"
          fi

      - name: Scrape
        working-directory: scraper
        env:
          SOURCE: ${{ github.event.inputs.source || 'search' }}
          MIN_SUBS: ${{ github.event.inputs.min_subscribers || '80000' }}
          MAX_SUBS: ${{ github.event.inputs.max_subscribers || '' }}
          CADENCE: ${{ github.event.inputs.require_cadence || 'monthly' }}
        run: |
          set -o pipefail
          ARGS="--min-subscribers $MIN_SUBS"
          if [ -n "$MAX_SUBS" ]; then
            ARGS="$ARGS --max-subscribers $MAX_SUBS"
          fi
          ARGS="$ARGS --output results.csv --concurrency 3 --delay 0.5 --solo-only --require-niche"
          ARGS="$ARGS --countries 'United States,Canada,United Kingdom,Ireland'"
          if [ -n "$CADENCE" ]; then
            ARGS="$ARGS --require-cadence $CADENCE"
          fi
          if [ "$SOURCE" = "search" ]; then
            ARGS="$ARGS --search-file holiday_terms.txt --duration long"
            ARGS="$ARGS --sort-by date --scrolls 3 --per-term 6 --limit 650"
            # Re-evaluate everything already discovered in the same pass, so the
            # 80k floor and the new niche/country columns apply to those too.
            if [ -f results/discovered.txt ]; then
              ARGS="$ARGS --input results/discovered.txt"
            fi
            ARGS="$ARGS --save-discovered discovered.txt"
          else
            ARGS="$ARGS --input holiday_seed_channels.csv"
          fi
          echo "Running: python youtube_scraper.py $ARGS"
          # Keep going on failure so a partial CSV is still published.
          python youtube_scraper.py $ARGS 2>&1 | tee run.log || true

      - name: Build shortlists
        working-directory: scraper
        continue-on-error: true
        run: |
          # Everything over the floor, solo/known type only.
          python make_shortlist.py results.csv shortlist.csv || true
          # And the 100k-200k slice, in case the ceiling still matters.
          python make_shortlist.py results.csv shortlist_100k_200k.csv \
            --max-subscribers 200000 || true
          # Kept separately: no person named, no links - needs a human look.
          python make_shortlist.py results.csv shortlist_unclear.csv \
            --include-unclear || true

      - name: Inspect channels for shared links or affiliates
        working-directory: scraper
        continue-on-error: true
        run: |
          python inspect_channels.py shortlist.csv \
            > inspect.json 2> inspect.err || true
          tail -40 inspect.err || true

      - name: Show results
        working-directory: scraper
        run: |
          echo "===== results.csv ====="
          cat results.csv || echo "no results.csv produced"
          echo "======================="

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p scraper/results
          cp scraper/results.csv scraper/results/holiday_channels.csv 2>/dev/null || true
          cp scraper/shortlist.csv scraper/results/shortlist.csv 2>/dev/null || true
          cp scraper/shortlist_100k_200k.csv scraper/results/shortlist_100k_200k.csv 2>/dev/null || true
          cp scraper/shortlist_unclear.csv scraper/results/shortlist_unclear.csv 2>/dev/null || true
          cp scraper/run.log scraper/results/run.log 2>/dev/null || true
          cp scraper/diagnose.log scraper/results/diagnose.log 2>/dev/null || true
          cp scraper/inspect.json scraper/results/inspect.json 2>/dev/null || true
          cp scraper/discovered.txt scraper/results/discovered.txt 2>/dev/null || true
          git add -f scraper/results/ || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Scrape results from workflow run ${{ github.run_id }}"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-results
          path: |
            scraper/results.csv
            scraper/run.log
            scraper/discovered.txt
          if-no-files-found: warn
