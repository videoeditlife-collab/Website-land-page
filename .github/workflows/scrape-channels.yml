name: Scrape YouTube channels

# Runs the scraper on a GitHub runner, which has the outbound network access
# that the development container does not, then commits the resulting CSV back
# to this branch.
#
# Triggered by touching scraper/.run-trigger, so a re-run is one small commit.

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'martial, outdoor, challenge, broad, agency, search or seed'
        required: false
        default: 'broad'
      min_subscribers:
        description: 'Minimum subscribers'
        required: false
        default: '20000'
      max_subscribers:
        description: 'Maximum subscribers (empty for no ceiling)'
        required: false
        default: ''
      require_cadence:
        description: 'weekly, biweekly, monthly, or empty for no check'
        required: false
        default: 'monthly'
  push:
    branches:
      - claude/youtube-scraper-zn66ns
    paths:
      - 'scraper/.run-trigger'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Self-test
        working-directory: scraper
        run: python test_scraper.py

      - name: Confirm YouTube is reachable
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://www.youtube.com/)
          echo "youtube.com -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::YouTube returned $code from this runner"
          fi

      - name: Scrape
        working-directory: scraper
        env:
          SOURCE: ${{ github.event.inputs.source || 'martial' }}
          MIN_SUBS: ${{ github.event.inputs.min_subscribers || '20000' }}
          MAX_SUBS: ${{ github.event.inputs.max_subscribers || '' }}
          CADENCE: ${{ github.event.inputs.require_cadence || 'monthly' }}
        run: |
          set -o pipefail
          # An array, not a string: a string expanded unquoted word-splits on
          # the spaces inside --countries and passes quotes as literal chars.
          ARGS=(--min-subscribers "$MIN_SUBS")
          if [ -n "$MAX_SUBS" ]; then
            ARGS+=(--max-subscribers "$MAX_SUBS")
          fi
          ARGS+=(--output results.csv --concurrency 3 --delay 0.5)
          # Josh's brief: target creator-operators who sell travel, which is the
          # inverse of the solo-only filter used on the previous lists.
          case "$SOURCE" in
            martial)
              ARGS+=(--require-niche --niche-file niche_broad.txt)
              ARGS+=(--search-file martial_terms.txt)
              ARGS+=(--sort-by date --scrolls 3 --per-term 8 --limit 700)
              ARGS+=(--save-discovered discovered_martial.txt)
              ;;
            outdoor)
              ARGS+=(--require-niche --niche-file niche_broad.txt)
              ARGS+=(--search-file outdoor_terms.txt)
              ARGS+=(--sort-by date --scrolls 3 --per-term 8 --limit 700)
              ARGS+=(--save-discovered discovered_outdoor.txt)
              ;;
            challenge)
              ARGS+=(--require-niche --niche-file niche_broad.txt)
              ARGS+=(--search-file challenge_terms.txt)
              ARGS+=(--sort-by date --scrolls 3 --per-term 8 --limit 700)
              ARGS+=(--save-discovered discovered_challenge.txt)
              ;;
            broad)
              ARGS+=(--require-niche --niche-file niche_broad.txt)
              ARGS+=(--search-file vlog_fitness_terms.txt)
              ARGS+=(--sort-by date --scrolls 3 --per-term 8 --limit 700)
              ARGS+=(--save-discovered discovered_broad.txt)
              ;;
            agency)
              ARGS+=(--business-only --require-niche)
              ARGS+=(--search-file agency_terms.txt)
              ARGS+=(--scrolls 3 --per-term 10 --limit 600)
              ARGS+=(--save-discovered discovered_agency.txt)
              ;;
            search)
              ARGS+=(--solo-only --require-niche)
              ARGS+=(--search-file holiday_terms.txt --duration long)
              ARGS+=(--sort-by date --scrolls 3 --per-term 6 --limit 650)
              ARGS+=(--save-discovered discovered.txt)
              ;;
            *)
              ARGS+=(--solo-only --require-niche)
              ARGS+=(--input holiday_seed_channels.csv)
              ;;
          esac
          printf 'Running: python youtube_scraper.py'; printf ' %q' "${ARGS[@]}"; echo
          printf '%s\n' "${ARGS[@]}" > .scrape-args
          # Discovery first, on its own, so the channel list can be banked
          # before the long part starts. Searching takes a few minutes;
          # reading 276 About pages takes a quarter of an hour, and a runner
          # preempted during it (exit 143) terminates the whole job - no
          # later step runs, not even one marked if: always(), so everything
          # on the runner's disk is lost. That cost two completed runs.
          # The seed mode reads a fixed CSV and discovers nothing, so it has
          # no list to bank and skips straight to the full pass.
          if grep -q -- '--save-discovered' .scrape-args; then
            python youtube_scraper.py "${ARGS[@]}" --discover-only \
              2>&1 | tee discover.log || true
          fi

      # Separate step, before the slow pass: whatever discovery found is
      # pushed immediately, so a preemption later costs time but not data.
      - name: Bank the discovered channel list
        run: |
          shopt -s nullglob
          found=(scraper/discovered*.txt)
          if [ ${#found[@]} -eq 0 ]; then
            echo "No discovered list produced - nothing to bank"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p scraper/results
          cp scraper/discovered*.txt scraper/results/ 2>/dev/null || true
          cp scraper/discover.log scraper/results/discover.log 2>/dev/null || true
          git add -f scraper/results/ || true
          if git diff --staged --quiet; then
            echo "Nothing new discovered"
            exit 0
          fi
          git commit -m "Discovered channel list from run ${{ github.run_id }}"
          for attempt in 1 2 3 4 5; do
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            git fetch origin "${{ github.ref_name }}" || true
            git rebase "origin/${{ github.ref_name }}" || { git rebase --abort || true; exit 1; }
            sleep $((attempt * 5))
          done
          exit 1

      - name: Read every discovered channel
        working-directory: scraper
        run: |
          set -o pipefail
          mapfile -t ARGS < .scrape-args
          # --resume so a re-run after a preemption picks up where this left
          # off rather than starting the 276 channels again.
          python youtube_scraper.py "${ARGS[@]}" --resume 2>&1 | tee run.log || true

      - name: Fail if the scrape produced nothing
        working-directory: scraper
        run: |
          # Without this the run reports success when the scraper never ran:
          # `|| true` above hides a crash, and the previous results file is
          # simply left in place, looking like a fresh result.
          if [ ! -s results.csv ]; then
            echo "::error::results.csv missing or empty - scraper did not run"
            tail -30 run.log || true
            exit 1
          fi
          rows=$(($(wc -l < results.csv) - 1))
          echo "results.csv has $rows rows"
          if [ "$rows" -lt 1 ]; then
            echo "::error::results.csv has no data rows"
            tail -30 run.log || true
            exit 1
          fi

      - name: Build shortlists
        working-directory: scraper
        continue-on-error: true
        run: |
          # Everything over the floor, solo/known type only.
          python make_shortlist.py results.csv shortlist.csv || true
          # And the 100k-200k slice, in case the ceiling still matters.
          python make_shortlist.py results.csv shortlist_100k_200k.csv \
            --max-subscribers 200000 || true
          # Kept separately: no person named, no links - needs a human look.
          python make_shortlist.py results.csv shortlist_unclear.csv \
            --include-unclear || true

      - name: Inspect channels for shared links or affiliates
        working-directory: scraper
        continue-on-error: true
        run: |
          python inspect_channels.py shortlist.csv \
            > inspect.json 2> inspect.err || true
          tail -40 inspect.err || true

      - name: Show results
        working-directory: scraper
        run: |
          echo "===== results.csv ====="
          cat results.csv || echo "no results.csv produced"
          echo "======================="

      - name: Commit results
        env:
          SOURCE: ${{ github.event.inputs.source || 'martial' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p scraper/results
          # One file per mode. The previous form copied results.csv over
          # holiday_channels.csv, broad_channels.csv AND agency_channels.csv
          # on every run whatever the mode, so each pass silently destroyed
          # the two earlier passes' results - the martial run's commit showed
          # 5,305 deletions for 3,759 insertions.
          cp scraper/results.csv "scraper/results/${SOURCE}_channels.csv" 2>/dev/null || true
          for f in shortlist.csv shortlist_100k_200k.csv shortlist_unclear.csv \
                   run.log diagnose.log inspect.json; do
            cp "scraper/$f" "scraper/results/${SOURCE}_$f" 2>/dev/null || true
          done
          cp scraper/discovered*.txt scraper/results/ 2>/dev/null || true
          git add -f scraper/results/ || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Scrape results from workflow run ${{ github.run_id }}"
          # Rebase and retry. A push straight to the branch is rejected as
          # non-fast-forward whenever anything else commits to it while the
          # scrape is running, which is normal here - the scrape takes 15
          # minutes and development continues meanwhile. That rejection lost
          # a completed martial arts run: the data only ever existed on the
          # runner, and the runner is reclaimed.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto the remote (attempt $attempt)"
            git fetch origin "${{ github.ref_name }}" || true
            # --no-rebase-merges keeps this a plain linear replay; the results
            # commit touches only files under scraper/results/.
            git rebase "origin/${{ github.ref_name }}" || {
              echo "::error::rebase conflicted - results are in the artifact"
              git rebase --abort || true
              exit 1
            }
            sleep $((attempt * 5))
          done
          echo "::error::could not push after 5 attempts - results are in the artifact"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-results
          # Every discovered list, not just discovered.txt: the artifact is
          # the only copy if the commit fails, and the mode in use decides
          # which of these files exists.
          path: |
            scraper/results.csv
            scraper/run.log
            scraper/discovered*.txt
            scraper/shortlist*.csv
          if-no-files-found: warn
